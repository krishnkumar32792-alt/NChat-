name: NChat Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          yes | sdkmanager --licenses || true

      - name: Generate clean Android project
        run: |
          npx expo prebuild --clean --platform android --no-install

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        run: |
          mkdir -p signed
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/nchat-release.keystore" \
            -storepass android \
            -keypass android \
            -alias nchat \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NChat,O=NChat,C=IN"

          zipalign_path="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          apksigner_path="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$zipalign_path" -f 4 \
            android/app/build/outputs/apk/release/app-release.apk \
            signed/NChat-aligned.apk

          "$apksigner_path" sign \
            --ks "$RUNNER_TEMP/nchat-release.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out signed/NChat.apk \
            signed/NChat-aligned.apk

          "$apksigner_path" verify --verbose signed/NChat.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: NChat-standalone-apk
          path: signed/NChat.apk
          if-no-files-found: error
